{% extends "attendance/base.html" %}
{% block content %}
<h2 class="mb-4">Mark Attendance</h2>
<form method="POST">{% csrf_token %}
<div class="mb-4"><label class="form-label">Select Date</label><input type="date" name="date" value="{{ selected_date }}" class="form-control" required></div>
<div class="table-responsive">
<table class="table table-bordered bg-white">
<thead class="table-dark"><tr><th>Register Number</th><th>Student Name</th><th>Attendance</th></tr></thead>
<tbody>
{% for student in students %}
<tr><td>{{ student.register_number }}</td><td>{{ student.name }}</td><td>
<select name="status_{{ student.id }}" class="form-select"><option value="Present">Present</option><option value="Absent">Absent</option></select>
</td></tr>
{% empty %}
<tr><td colspan="3" class="text-center">No students available. Add students first.</td></tr>
{% endfor %}
</tbody>
</table>
</div>
<button type="submit" class="btn btn-success">Save Attendance</button>
</form>
{% endblock %}
