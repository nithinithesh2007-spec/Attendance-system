{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'attendance/style.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">📚 Attendance System</a>
        <div class="d-flex gap-2 flex-wrap">
            <a class="btn btn-outline-light btn-sm" href="{% url 'home' %}">Dashboard</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'students' %}">Students</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'mark_attendance' %}">Attendance</a>
            <a class="btn btn-outline-light btn-sm" href="{% url 'attendance_report' %}">Reports</a>
            <a class="btn btn-warning btn-sm" href="/admin/">Admin</a>
        </div>
    </div>
</nav>
<div class="container py-4">
    {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
