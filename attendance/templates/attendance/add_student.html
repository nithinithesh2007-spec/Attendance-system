{% extends "attendance/base.html" %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-7">
<h2 class="mb-4">Add Student</h2>
<form method="POST">{% csrf_token %}
<div class="mb-3"><label class="form-label">Student Name</label><input type="text" name="name" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Register Number</label><input type="text" name="register_number" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
<div class="mb-3"><label class="form-label">Department</label><input type="text" name="department" class="form-control" placeholder="CSE" required></div>
<div class="mb-3"><label class="form-label">Year</label><select name="year" class="form-select" required><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select></div>
<button type="submit" class="btn btn-primary">Add Student</button>
<a href="{% url 'students' %}" class="btn btn-secondary">Cancel</a>
</form>
</div>
</div>
{% endblock %}
